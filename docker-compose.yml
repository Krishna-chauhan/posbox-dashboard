services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dashboard-app
    ports:
      - "${APP_PORT:-8081}:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    networks:
      - dashboard-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  dashboard-network:
    driver: bridge

volumes:
  dashboard-data:
    driver: local
