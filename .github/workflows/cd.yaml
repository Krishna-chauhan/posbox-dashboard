name: CD - Test Vercel Frontend Deployment (Dev)

on:
  push:
    branches: [development, dev-krishna]
  workflow_dispatch:
    inputs:
      test_build_only:
        description: "Only build (skip deploy)"
        required: false
        default: false
        type: boolean

jobs:
  deploy-frontend:
    name: Deploy Frontend to Vercel (Test)
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Resolve API base URL
        run: |
          DEFAULT_API_URL="https://krishna.fit"
          DEFAULT_PROJECT_NAME="POSBOX"
          DEFAULT_APP_TITLE="POSBOX Dashboard"
          if [ -n "${{ secrets.REACT_APP_API_BASE_URL }}" ]; then
            API_URL="${{ secrets.REACT_APP_API_BASE_URL }}"
            echo "Using REACT_APP_API_BASE_URL from GitHub secret"
          else
            API_URL="$DEFAULT_API_URL"
            echo "REACT_APP_API_BASE_URL secret not set - using default: $API_URL"
          fi
          echo "REACT_APP_API_BASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "REACT_APP_PROJECT_NAME=$DEFAULT_PROJECT_NAME" >> "$GITHUB_ENV"
          echo "REACT_APP_APP_TITLE=$DEFAULT_APP_TITLE" >> "$GITHUB_ENV"
          echo "Resolved REACT_APP_API_BASE_URL=$API_URL"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "16"
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@41.7.8

      - name: Verify Vercel CLI installation
        run: vercel --version

      - name: Validate secrets are set
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN secret is not set"
            exit 1
          fi
          if [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "VERCEL_PROJECT_ID secret is not set"
            exit 1
          fi
          if [ -n "$VERCEL_ORG_ID" ] && [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "VERCEL_ORG_ID is set but VERCEL_PROJECT_ID is missing"
            exit 1
          fi
          echo "VERCEL_ORG_ID=${VERCEL_ORG_ID:0:8}..."
          echo "VERCEL_PROJECT_ID=${VERCEL_PROJECT_ID:0:8}..."
          echo "Required secrets are configured"

      - name: Link Vercel Project
        run: |
          rm -rf .vercel
          echo "Linking Vercel project..."
          vercel link --yes --token="$VERCEL_TOKEN" --project="$VERCEL_PROJECT_ID" --scope="$VERCEL_ORG_ID"
          cat .vercel/project.json

      - name: Create production env file
        run: |
          {
            echo "REACT_APP_API_BASE_URL=$REACT_APP_API_BASE_URL"
            echo "REACT_APP_PROJECT_NAME=$REACT_APP_PROJECT_NAME"
            echo "REACT_APP_APP_TITLE=$REACT_APP_APP_TITLE"
          } > .env.production
          echo "Created .env.production:"
          cat .env.production

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Verify Environment Configuration Before Build
        run: |
          echo "=== Environment Check Before Build ==="
          echo "REACT_APP_API_BASE_URL from env: ${REACT_APP_API_BASE_URL:-NOT SET}"
          if [ -f .env.production ]; then
            echo ".env.production contents:"
            cat .env.production
          else
            echo ".env.production file does not exist"
          fi
          echo "======================================"

      - name: Build Project Artifacts
        env:
          REACT_APP_API_BASE_URL: ${{ env.REACT_APP_API_BASE_URL }}
          REACT_APP_PROJECT_NAME: ${{ env.REACT_APP_PROJECT_NAME }}
          REACT_APP_APP_TITLE: ${{ env.REACT_APP_APP_TITLE }}
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          echo "Building with REACT_APP_API_BASE_URL=$REACT_APP_API_BASE_URL"
          DISABLE_ESLINT_PLUGIN=true GENERATE_SOURCEMAP=false npm run build

      - name: Deploy Project Artifacts to Vercel
        id: vercel-deploy
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.test_build_only != true }}
        run: |
          echo "Deploying build/ to Vercel..."
          DEPLOYMENT_OUTPUT=$(vercel deploy build --prod --token="$VERCEL_TOKEN" 2>&1)
          DEPLOYMENT_URL=$(echo "$DEPLOYMENT_OUTPUT" | grep -oE 'https://[^[:space:]]+\.vercel\.app' | head -1 || echo "")
          if [ -z "$DEPLOYMENT_URL" ]; then
            DEPLOYMENT_URL=$(echo "$DEPLOYMENT_OUTPUT" | grep -oE 'https://[^[:space:]]+' | head -1 || echo "Check Vercel dashboard for URL")
          fi
          echo "deployment_url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
          echo "Frontend deployed to: $DEPLOYMENT_URL"
          echo "$DEPLOYMENT_OUTPUT"

      - name: Display Deployment URL
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.test_build_only != true }}
        env:
          DEPLOYMENT_URL: ${{ steps.vercel-deploy.outputs.deployment_url }}
        run: echo "Frontend is now live at $DEPLOYMENT_URL"

      - name: Build only complete
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_build_only == true }}
        run: echo "Build completed. Deploy skipped (test_build_only=true)."
